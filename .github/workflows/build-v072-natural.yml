name: Build Chef Asistente v0.7.2 Natural Conversation

on:
  push:
    branches: [ chef-v0.7.2-natural ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Chef
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools, NDK and CMake
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Test local natural-language intents
        run: |
          cat > /tmp/TestNatural.java <<'EOF'
          package pe.chef.asistente;
          public class TestNatural {
              private static void check(String expected, String actual) {
                  if (!expected.equals(actual)) throw new RuntimeException("Expected " + expected + " but got " + actual);
              }
              public static void main(String[] args) {
                  check("comenzar", NaturalLanguage.interpret("ya tengo todo", 2));
                  check("ingredientes", NaturalLanguage.interpret("dime que compro", 2));
                  check("preparacion", NaturalLanguage.interpret("explicame como se hace", 2));
                  check("siguiente", NaturalLanguage.interpret("ya termine este paso", 3));
                  check("siguiente", NaturalLanguage.interpret("que hago ahora", 3));
                  check("repetir", NaturalLanguage.interpret("no entendi repitemelo", 3));
                  check("anterior", NaturalLanguage.interpret("regresa un paso", 3));
                  check("pausa", NaturalLanguage.interpret("dame un momento", 3));
                  check("cuanto sillao era", NaturalLanguage.interpret("cuanto sillao era", 3));
                  System.out.println("Natural-language local tests: OK");
              }
          }
          EOF
          rm -rf /tmp/nlclasses && mkdir -p /tmp/nlclasses
          javac -d /tmp/nlclasses app/src/main/java/pe/chef/asistente/NaturalLanguage.java /tmp/TestNatural.java
          java -cp /tmp/nlclasses pe.chef.asistente.TestNatural

      - name: Patch stable Chef core for natural conversation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/pe/chef/asistente/MainActivity.java')
          s = p.read_text()
          replacements = [
              ('TextView brand = label("CHEF ASISTENTE · HÍBRIDO v0.4", 13, Color.WHITE, true);',
               'TextView brand = label("CHEF ASISTENTE · CONVERSACIÓN NATURAL v0.7.2", 13, Color.WHITE, true);'),
              ('TextView sub = label("Funciona sin internet y actualiza recetas cuando hay conexión", 14, Color.rgb(224, 242, 236), false);',
               'TextView sub = label("Háblame normalmente · no necesitas memorizar comandos", 14, Color.rgb(224, 242, 236), false);'),
              ('heardStatus = label("🎙️ Aún no has usado el dictado", 12, MUTED, false);',
               'heardStatus = label("🎙️ Puedes hablarme como hablarías con una persona", 12, MUTED, false);'),
              ('root.addView(heardStatus);',
               'root.addView(heardStatus);\n        TextView naturalHelp = label("💬 Ejemplos: ya tengo todo · qué sigue · repítemelo · cuánto sillao era", 12, MUTED, false);\n        naturalHelp.setPadding(dp(4), 0, dp(4), dp(6));\n        root.addView(naturalHelp);'),
              ('input.setHint("O escribe: quiero arroz chaufa");',
               'input.setHint("Escribe como hablas: ya tengo todo, qué sigue...");'),
              ('String in = norm(raw);',
               'String in = NaturalLanguage.interpret(norm(raw), state);'),
              ('response = "Perfecto. " + ingredientSummary() + " También tengo la preparación previa completa. Puedes decir preparación o comenzar.";',
               'response = "Perfecto. " + ingredientSummary() + " Puedo explicarte lo que conviene preparar antes, responder cantidades o empezar contigo paso a paso. Dime con tus propias palabras qué quieres hacer.";'),
              ('response = "Puedes decir comenzar, preparación, ingredientes o preguntarme cuánto necesitas de un ingrediente.";',
               'response = "Cuéntame con naturalidad qué necesitas. Puedes preguntarme qué lleva, cómo se prepara, cuánto necesitas de algo o decirme que ya tienes todo y quieres cocinar.";'),
              ('response = "De acuerdo. Nos quedamos en el paso " + (stepIndex + 1) + ". Cuando quieras continuar, dime repetir o siguiente.";',
               'response = "Claro. Nos quedamos exactamente en el paso " + (stepIndex + 1) + ". Cuando estés listo, háblame normalmente y continuamos desde aquí.";'),
              ('response = "Estamos en el paso " + (stepIndex + 1) + ". Puedes decir siguiente, repetir, anterior, ingredientes, cuánto necesitas de algo o pausa.";',
               'response = "No entendí del todo lo que necesitas. Seguimos en el paso " + (stepIndex + 1) + ". Dímelo con tus palabras: ya terminé este paso, repítemelo, cuánto sillao era, regresa un paso o dame un momento.";'),
              ('out.append(" Cuando termines, dime siguiente.");',
               'out.append(" Cuando termines, solo avísame como te salga natural. También puedes preguntarme cantidades o pedirme que lo repita.");'),
              ('if (best == null) return "No identifiqué el ingrediente. Puedes decir, por ejemplo: cuánto sillao necesito.";',
               'if (best == null) return "No alcancé a identificar el ingrediente. Dímelo de otra forma, por ejemplo: ¿cuánto sillao le pongo?";'),
              ('return -1;\n    }\n\n    private void launchVoiceInput()',
               'if (inputText.contains("solo para mi") || inputText.contains("para mi solo") || inputText.contains("para mi sola")) return 1;\n        return -1;\n    }\n\n    private void launchVoiceInput()'),
              ('tts.speak("Hola. Soy Chef Asistente. ¿Qué quieres cocinar hoy?", TextToSpeech.QUEUE_FLUSH, null, "greeting");',
               'tts.speak("Hola. Soy Chef Asistente. Háblame normalmente. ¿Qué quieres cocinar hoy?", TextToSpeech.QUEUE_FLUSH, null, "greeting");')
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Patch target not found: ' + old[:100])
              s = s.replace(old, new, 1)
          p.write_text(s)
          print('MainActivity natural conversation patch: OK')
          PY

      - name: Patch offline voice labels for natural conversation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/pe/chef/asistente/OfflineMainActivity.java')
          s = p.read_text()
          pairs = [
              ('PREPARANDO WHISPER BASE', 'PREPARANDO VOZ NATURAL'),
              ('Whisper Base v0.7.1 en español', 'Whisper Base v0.7.2 · conversación natural'),
              ('✅ Whisper Base listo · español de cocina · IA local · sin Internet', '✅ Voz natural lista · Whisper Base · español · sin Internet'),
              ('🎙️ Whisper Base escuchó:', '🎙️ Te entendí:'),
              ('⏳  WHISPER BASE ESTÁ ENTENDIENDO…', '⏳  ENTENDIENDO LO QUE DIJISTE…'),
              ('🎙️ Whisper Base escuchando SIN INTERNET…', '🎙️ Háblame normalmente · te escucho SIN INTERNET…'),
              ('⏹  DETENER Y ENTENDER', '⏹  TERMINÉ DE HABLAR'),
              ('🎤  HABLAR CON WHISPER BASE', '🎤  HABLAR CON CHEF'),
              ('CHEF ASISTENTE · WHISPER BASE v0.7.1', 'CHEF ASISTENTE · CONVERSACIÓN NATURAL v0.7.2'),
              ('Whisper Base + vocabulario de cocina · IA local sin costo por uso', 'Habla con naturalidad · Whisper Base local · sin costo por conversación')
          ]
          for old, new in pairs:
              if old not in s:
                  raise SystemExit('Voice label patch target not found: ' + old)
              s = s.replace(old, new)
          p.write_text(s)
          print('OfflineMainActivity natural labels: OK')
          PY

      - name: Bundle Chef recipe catalogs
        run: |
          mkdir -p app/src/main/assets
          cp data/recetas.json app/src/main/assets/recetas.json
          if [ -f data/recetas_pack2.json ]; then
            cp data/recetas_pack2.json app/src/main/assets/recetas_pack2.json
          fi

      - name: Build pinned whisper.cpp for natural Spanish cooking conversation
        run: |
          git clone https://github.com/ggml-org/whisper.cpp.git whisper-src
          cd whisper-src
          git checkout 592feef04a1802b18cbeffd0fd0eb5d02570c2ec
          JNI=examples/whisper.android/lib/src/main/jni/whisper/jni.c
          sed -i 's/Java_com_whispercpp_whisper_WhisperLib_00024Companion_/Java_pe_chef_asistente_WhisperBridge_/g' "$JNI"
          sed -i 's/Java_com_whispercppdemo_whisper_WhisperLib_00024Companion_/Java_pe_chef_asistente_WhisperBridge_/g' "$JNI"
          sed -i 's/params.language = "en";/params.language = "es";/' "$JNI"
          sed -i 's/WHISPER_SAMPLING_GREEDY/WHISPER_SAMPLING_BEAM_SEARCH/' "$JNI"
          sed -i '/params.language = "es";/a\    params.initial_prompt = "Chef Asistente. Conversacion natural de cocina peruana: arroz chaufa, lomo saltado, aji de gallina, arroz con pollo, tallarin saltado, pollo al horno, causa rellena, papa a la huancaina, estofado de pollo, ceviche, seco de res, tallarines verdes, sopa criolla, sillao, cebolla china, kion, aji amarillo. Frases naturales: quiero arroz chaufa, somos cuatro, ya tengo todo, que sigue, repitemelo, cuanto sillao era, regresa un paso, dame un momento, ya termine este paso.";' "$JNI"
          sed -i '/params.initial_prompt/a\    params.single_segment = true;\n    params.no_timestamps = true;\n    params.beam_search.beam_size = 5;\n    params.beam_search.patience = 1.0f;' "$JNI"
          sed -i "s/abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'/abiFilters 'arm64-v8a'/" examples/whisper.android/lib/build.gradle
          cd examples/whisper.android
          chmod +x gradlew
          ./gradlew :lib:assembleRelease --stacktrace
          cd ../../..
          mkdir -p app/src/main/jniLibs/arm64-v8a
          rm -rf /tmp/whisper-aar && mkdir -p /tmp/whisper-aar
          unzip -q whisper-src/examples/whisper.android/lib/build/outputs/aar/lib-release.aar -d /tmp/whisper-aar
          cp /tmp/whisper-aar/jni/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/

      - name: Bundle multilingual Whisper Base model and MIT notices
        run: |
          cd whisper-src
          bash models/download-ggml-model.sh base
          cd ..
          mkdir -p app/src/main/assets/models/whisper app/src/main/assets/licenses
          cp whisper-src/models/ggml-base.bin app/src/main/assets/models/whisper/ggml-base.bin
          cp whisper-src/LICENSE app/src/main/assets/licenses/WHISPER_CPP_LICENSE.txt
          curl -L --fail https://raw.githubusercontent.com/openai/whisper/main/LICENSE -o app/src/main/assets/licenses/OPENAI_WHISPER_LICENSE.txt
          test -s app/src/main/assets/models/whisper/ggml-base.bin

      - name: Generate temporary v0.7.2 test signing key
        run: |
          keytool -genkeypair -v -keystore app/chef-release.jks -storepass 'ChefWhisper072Demo!' -keypass 'ChefWhisper072Demo!' -alias chef-whisper072 -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Chef Asistente Natural Test, OU=Development, O=Chef Asistente, L=Tacna, ST=Tacna, C=PE"

      - name: Build signed Chef v0.7.2 APK
        env:
          CHEF_KEYSTORE: chef-release.jks
          CHEF_STORE_PASSWORD: 'ChefWhisper072Demo!'
          CHEF_KEY_ALIAS: chef-whisper072
          CHEF_KEY_PASSWORD: 'ChefWhisper072Demo!'
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature and offline contents
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -E 'ggml-base.bin|libwhisper.so|OPENAI_WHISPER_LICENSE|WHISPER_CPP_LICENSE'
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Prepare deliverable
        run: cp app/build/outputs/apk/release/app-release.apk ChefAsistente_v0.7.2_CONVERSACION_NATURAL.apk

      - name: Upload Chef v0.7.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: ChefAsistente-v0.7.2-CONVERSACION-NATURAL
          path: ChefAsistente_v0.7.2_CONVERSACION_NATURAL.apk
          retention-days: 30
