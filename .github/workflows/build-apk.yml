name: Build Chef Asistente Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CHEF_KEYSTORE_PASSWORD: ChefAsistenteTest2026
      CHEF_KEY_PASSWORD: ChefAsistenteTest2026
      CHEF_KEY_ALIAS: chef-asistente

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate temporary release signing key
        run: |
          KEYSTORE="$RUNNER_TEMP/chef-release.p12"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass "$CHEF_KEYSTORE_PASSWORD" \
            -keypass "$CHEF_KEY_PASSWORD" \
            -alias "$CHEF_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=Chef Asistente Prototype, OU=Mobile, O=Chef Asistente, L=Tacna, ST=Tacna, C=PE"
          echo "CHEF_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare deliverable
        run: |
          cp app/build/outputs/apk/release/app-release.apk ChefAsistente_v0.2_release.apk
          sha256sum ChefAsistente_v0.2_release.apk > ChefAsistente_v0.2_release.sha256.txt

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ChefAsistente-v0.2-Release
          path: |
            ChefAsistente_v0.2_release.apk
            ChefAsistente_v0.2_release.sha256.txt
          retention-days: 30
