name: Build Chef Asistente v0.6 Offline Voice APK

on:
  push:
    branches: [ main, chef-v0.6-offline ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Bundle recipe catalogs
        run: |
          mkdir -p app/src/main/assets
          cp data/recetas.json app/src/main/assets/recetas.json
          if [ -f data/recetas_pack2.json ]; then
            cp data/recetas_pack2.json app/src/main/assets/recetas_pack2.json
          fi

      - name: Download official sherpa-onnx Android library
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 \
            -o app/libs/sherpa-onnx-1.13.5.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.5/sherpa-onnx-1.13.5.aar
          ls -lh app/libs/sherpa-onnx-1.13.5.aar

      - name: Bundle Spanish Moonshine v2 offline model
        run: |
          MODEL=sherpa-onnx-moonshine-base-es-quantized-2026-02-27
          curl -L --fail --retry 3 \
            -o moonshine-es.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/${MODEL}.tar.bz2
          tar xjf moonshine-es.tar.bz2
          mkdir -p app/src/main/assets/models/moonshine-es
          cp ${MODEL}/encoder_model.ort app/src/main/assets/models/moonshine-es/
          cp ${MODEL}/decoder_model_merged.ort app/src/main/assets/models/moonshine-es/
          cp ${MODEL}/tokens.txt app/src/main/assets/models/moonshine-es/
          if [ -f ${MODEL}/LICENSE ]; then
            cp ${MODEL}/LICENSE app/src/main/assets/models/moonshine-es/MODEL_LICENSE.txt
          fi
          ls -lh app/src/main/assets/models/moonshine-es/

      - name: Generate temporary demo signing key
        run: |
          keytool -genkeypair -v -keystore app/chef-release.jks -storepass 'ChefDemo2026!' -keypass 'ChefDemo2026!' -alias chef -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Chef Asistente Demo, OU=Development, O=Chef Asistente, L=Tacna, ST=Tacna, C=PE"

      - name: Build signed release APK
        env:
          CHEF_KEYSTORE: chef-release.jks
          CHEF_STORE_PASSWORD: 'ChefDemo2026!'
          CHEF_KEY_ALIAS: chef
          CHEF_KEY_PASSWORD: 'ChefDemo2026!'
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Show APK size
        run: ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Prepare deliverable
        run: cp app/build/outputs/apk/release/app-release.apk ChefAsistente_v0.6_OFFLINE_VOZ.apk

      - name: Upload offline voice APK
        uses: actions/upload-artifact@v4
        with:
          name: ChefAsistente-v0.6-OFFLINE-VOZ
          path: ChefAsistente_v0.6_OFFLINE_VOZ.apk
          retention-days: 30
