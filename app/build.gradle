plugins {
    id 'com.android.application'
}

android {
    namespace 'pe.chef.asistente'
    compileSdk 36

    defaultConfig {
        applicationId "pe.chef.asistente"
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName "0.2"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("CHEF_KEYSTORE_FILE")
            if (keystorePath != null && !keystorePath.isBlank()) {
                storeFile file(keystorePath)
                storePassword System.getenv("CHEF_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CHEF_KEY_ALIAS")
                keyPassword System.getenv("CHEF_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
