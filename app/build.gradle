plugins {
    id 'com.android.application'
}

android {
    namespace 'pe.chef.asistente'
    compileSdk 36

    defaultConfig {
        applicationId "pe.chef.asistente.whisper071"
        minSdk 23
        targetSdk 36
        versionCode 10
        versionName "0.7.1"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("CHEF_KEYSTORE") ?: "chef-release.jks")
            storePassword System.getenv("CHEF_STORE_PASSWORD") ?: "ChefDemo2026!"
            keyAlias System.getenv("CHEF_KEY_ALIAS") ?: "chef"
            keyPassword System.getenv("CHEF_KEY_PASSWORD") ?: "ChefDemo2026!"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
